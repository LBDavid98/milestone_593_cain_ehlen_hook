# Builds the recommender app's container image and publishes it to GitHub's container registry,
# where Azure Container Apps pulls it from.
name: app image

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ghcr.io/lbdavid98/readers-also-read:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
