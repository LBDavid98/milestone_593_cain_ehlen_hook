<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Recommender</title>
<style>
  :root { --bg: #f6f7f9; --text: #1d2330; --muted: #5d6675; --accent: #2a78d6; --track: #dde1e7; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14171c; --text: #e8eaee; --muted: #9aa3b2; --accent: #5b9cec; --track: #2e343e; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 440px; padding: 24px 16px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 8px 0; }
  .spin { width: 36px; height: 36px; margin: 24px auto; border-radius: 50%;
          border: 4px solid var(--track); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Book Recommender</h1>
  <p>"Readers also read…" · SIADS 593 Milestone I</p>
  <div class="spin" aria-hidden="true"></div>
  <p id="status">Waking the app up. It sleeps when nobody is using it, so the first visit takes 10–30 seconds.</p>
  <p><a id="direct" href="#">Open the app directly</a></p>
</main>
<script>
const APP = "https://readers-also-read.calmwave-f7ef5c74.westus2.azurecontainerapps.io/";
document.getElementById("direct").href = APP;
const started = Date.now();

// Any response, even an opaque one, means the container is up; a network error means it is still waking.
async function ping() {
  try {
    await fetch(APP, {mode: "no-cors", cache: "no-store"});
    location.replace(APP);
  } catch (e) {
    const seconds = Math.round((Date.now() - started) / 1000);
    document.getElementById("status").textContent =
      `Still waking up (${seconds} s). The first visit after a quiet spell takes 10–30 seconds.`;
    setTimeout(ping, 2000);
  }
}
ping();
</script>
</body>
</html>
